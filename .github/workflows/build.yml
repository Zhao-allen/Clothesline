name: Build & Release

# Builds Clothesline and publishes a GitHub Release with two assets:
#   - Clothesline-Setup.exe        (installer with language picker + custom path)
#   - Clothesline-win-x64.zip      (portable folder, unzip and run)
#
# Trigger: push a tag "v*", or run the workflow manually (workflow_dispatch)
# from the Actions tab and optionally type a version like v0.2.0.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v0.2.0. Leave empty to read <Version> from Clothesline.csproj."
        required: false
        default: ""

permissions:
  contents: write

env:
  DOTNET_VERSION: "9.0.x"
  RUNTIME: "win-x64"

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          $tag = '${{ inputs.version }}'.Trim()
          if ('${{ github.event_name }}' -eq 'push') {
            $tag = '${{ github.ref_name }}'
          }
          if ([string]::IsNullOrWhiteSpace($tag)) {
            $line = Select-String -Path Clothesline.csproj -Pattern '<Version>(.+?)</Version>' |
                    Select-Object -First 1
            if (-not $line) { throw "could not read <Version> from Clothesline.csproj" }
            $tag = 'v' + $line.Matches[0].Groups[1].Value
          }
          # Accept v1.2.3 or v1.2.3.4 (3 or 4 numeric segments).
          # Auto-prepend 'v' if the user forgot it (so '0.3.4' → 'v0.3.4').
          if ($tag -notmatch '^v\d+\.\d+\.\d+(\.\d+)?$') {
            if ($tag -match '^\d+\.\d+\.\d+(\.\d+)?$') {
              $tag = 'v' + $tag
            } else {
              throw "tag must look like v1.2.3 or v1.2.3.4, got '$tag'"
            }
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "release tag: $tag"

      # Folder publish, NOT PublishSingleFile: single-file silently drops the
      # es/zh/ja/fr satellite resource DLLs and ships an English-only build.
      - name: Publish app (self-contained folder, all 5 languages)
        shell: pwsh
        run: |
          dotnet publish Clothesline.csproj `
            -c Release -r ${{ env.RUNTIME }} --self-contained true -o publish
          foreach ($lang in 'es', 'zh', 'ja', 'fr') {
            if (-not (Test-Path "publish\$lang")) {
              throw "satellite folder 'publish\$lang' missing - build would be English-only"
            }
          }
          Get-ChildItem publish -Directory | Select-Object Name

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Clothesline-win-x64.zip -Force
          "zip: {0:N1} MB" -f ((Get-Item Clothesline-win-x64.zip).Length / 1MB)

      - name: Build installer payload
        shell: pwsh
        run: |
          dotnet run --project Setup/MakePayload -- publish Setup\payload.zip
          Move-Item Setup\payload.zip Setup\InstallerWPF\payload.zip -Force

      - name: Build setup installer (single-file, payload embedded)
        shell: pwsh
        run: |
          dotnet publish Setup\InstallerWPF\InstallerWPF.csproj `
            -c Release -r ${{ env.RUNTIME }} --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeAllContentForSelfExtract=true -o Setup\out
          Move-Item Setup\out\Clothesline-Setup.exe Clothesline-Setup.exe -Force

      - name: Smoke-test the installer
        shell: pwsh
        run: |
          # Run the artifact before publishing it. Three releases in a row
          # shipped installers that crashed on first double-click while CI
          # stayed green, because every check so far only verified that the
          # files EXIST. Existence is not the contract: the contract is that
          # a user can run it. /silent takes the same Install() path the GUI
          # does, minus the window - and the v0.3.3 regression was exactly a
          # window-creation crash, which is why the GUI is exercised too
          # (started, given three seconds to show its first window, then
          # killed; surviving that long means chrome construction worked).
          $smoke = Join-Path $env:TEMP 'clothesline-smoke'
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          $logDir = Join-Path $env:LOCALAPPDATA 'Clothesline'
          Remove-Item $logDir -Recurse -Force -ErrorAction SilentlyContinue

          # Use Start-Process -Wait -PassThru so ExitCode is always captured,
          # even when the process is killed by WER (which makes $LASTEXITCODE
          # empty on PowerShell 7).
          $p = Start-Process -FilePath .\Clothesline-Setup.exe -ArgumentList '/silent','/dir=$smoke','/nostartmenu' -Wait -PassThru -NoNewWindow
          Write-Host "silent install exit: $($p.ExitCode)"
          if (Test-Path (Join-Path $logDir 'install.log')) {
            Write-Host '--- install.log ---'
            Get-Content (Join-Path $logDir 'install.log')
            Write-Host '--- end install.log ---'
          }
          if ($p.ExitCode -ne 0) { throw "silent install failed with exit $($p.ExitCode)" }
          if (-not (Test-Path (Join-Path $smoke 'Clothesline.exe'))) { throw 'Clothesline.exe missing after silent install' }

          $gui = Start-Process -FilePath .\Clothesline-Setup.exe -PassThru
          Start-Sleep -Seconds 4
          if ($gui.HasExited) {
            if (Test-Path (Join-Path $logDir 'install.log')) {
              Write-Host '--- install.log (GUI crash) ---'
              Get-Content (Join-Path $logDir 'install.log')
              Write-Host '--- end install.log ---'
            }
            throw "installer GUI exited with code $($gui.ExitCode) - window creation crashed"
          }
          Stop-Process -Id $gui.Id -Force
          $p2 = Start-Process -FilePath .\Clothesline-Setup.exe -ArgumentList '/silent','/uninstall','/dir=$smoke' -Wait -PassThru -NoNewWindow
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output "installer smoke test passed (uninstall exit: $($p2.ExitCode))"

      - name: Verify artifacts
        shell: pwsh
        run: |
          foreach ($f in 'Clothesline-Setup.exe', 'Clothesline-win-x64.zip') {
            if (-not (Test-Path $f)) { throw "$f missing" }
          }
          Get-Item Clothesline-Setup.exe, Clothesline-win-x64.zip |
            Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,1)}}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          if-no-files-found: error
          path: |
            Clothesline-Setup.exe
            Clothesline-win-x64.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Clothesline ${{ needs.build.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            assets/Clothesline-Setup.exe
            assets/Clothesline-win-x64.zip
